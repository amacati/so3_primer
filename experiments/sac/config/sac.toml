[checkpoint]
path = "saves/sac"

[wandb]
project = "rot|sac"
group = ""
entity = "lsy-tum"

[env]
name = "Rotation-v0"
n_envs = 32
[env.kwargs]
device = "gpu"
action_type = "tangent"
obs_type = "tangent"
control_mode = "rel"
reward_type = "sparse"

[sac]
# General params
device = "cuda"
# Rollout params
n_steps = 128_000
# Training params
actor_lr = 0.001
critic_lr = 0.001
buffer_size = 128_000
eps = 1e-8                 # AdamW epsilon
train_period = 100
train_steps = 5
actor_period = 1
critic_period = 1
target_period = 40
tau = 0.005
gamma = 0.99
grad_clip = 2.5
batch_size = 4096
alpha = 0.2
autotune_alpha = true
alpha_lr = 0.0003
learning_starts = 0
# Eval params
eval_period = 3_200 # 6_400
eval_steps = 3_200
# Checkpoint params
checkpoint_path = "saves/sac"
checkpoint_buffer = false
# checkpoint_period = 1_280 
# overwrite_policy = false
# Action transform
[[sac.action_tf]]
type = "IdentityTF"

[overrides]

# All values are derived from relative actions
[overrides.tangent-matrix-sparse]  # https://wandb.ai/lsy-tum/rot%7Csac_sweep/runs/rkk15cr9?nw=nwuseru1999168
