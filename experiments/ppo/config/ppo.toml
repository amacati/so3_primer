[checkpoint]
path = "saves/ppo"

[wandb]
project = "rot|ppo"
group = ""
entity = "lsy-tum"

[env]
name = "Rotation-v0"
n_envs = 32
[env.kwargs]
device = "gpu"
action_type = "tangent"
obs_type = "tangent"
control_mode = "rel"

[ppo]
n_steps = 50            # period = 1600
n_minibatches = 10
n_total_steps = 400_000
actor_lr = 0.001
critic_lr = 0.001
n_epochs = 10

eval_period = 6400
n_eval_steps = 16_000
# checkpoint_period = 4_000 
# overwrite_policy = false

clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 1.0
target_kl = -1      # Toml doesn't support None
gamma = 0.99
norm_adv = true
clip_vloss = true
gae_lambda = 0.95
device = "cuda"
use_logstd_net = false

[overrides]
[overrides.tangent-matrix]  # https://wandb.ai/lsy-tum/rot%7Cppo_sweep/runs/7ma2fyjn/overview
actor_lr = 9.16e-4
clip_coef = 0.130
critic_lr = 2.18e-3
ent_coef = 0.013
gae_lambda = 0.800
gamma = 0.916
max_grad_norm = 0.602
n_epochs = 20
n_minibatches = 8
n_steps = 100
vf_coef = 0.740

[overrides.euler-matrix]  # https://wandb.ai/lsy-tum/rot%7Cppo_sweep/runs/16yhni5s/overview
