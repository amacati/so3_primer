[wandb]
project = "rot|td3"
group = "quat"
entity = "lsy-tum"

[env]
name = "Rotation-v0"
n_envs = 32
[env.kwargs]
device = "gpu"
action_type = "quat"
obs_type = "quat"
control_mode = "rel"
reward_type = "sparse"

[td3]
# General params
device = "cuda"
# Rollout params
n_steps = 128_000
# Training params
actor_lr = 0.001
critic_lr = 0.001
buffer_size = 128_000
train_period = 200         # 1600
train_steps = 5            # 40
actor_period = 1
critic_period = 1
actor_target_period = 40
critic_target_period = 40
tau = 0.05
gamma = 0.98
grad_clip = 5.0
batch_size = 4096
reward_clip = [-50.0, 0.0]
# Eval params
eval_period = 3_200 # 6_400
eval_steps = 3_200  # 50 * 64
# Checkpoint params
checkpoint_path = "saves/td3"
checkpoint_buffer = false
# checkpoint_period = 1_280 
# overwrite_policy = false
# Action transform -> Uniform Noise with probability 0.3 and clipping to [-1.0, 1.0]
[[td3.action_tf]]
type = "ChoiceTF"
[td3.action_tf.kwargs]
prob = [0.7, 0.3]
[[td3.action_tf.kwargs.transforms]]
type = "IdentityTF"
[[td3.action_tf.kwargs.transforms]]
type = "ReplaceWithNoiseTF"
[td3.action_tf.kwargs.transforms.kwargs.noise]
type = "UniformNoise"
[td3.action_tf.kwargs.transforms.kwargs.noise.kwargs]
min = -1.0
max = 1.0
[[td3.action_tf]]
type = "ClipTF"
[td3.action_tf.kwargs]
min = -1.0
max = 1.0
# Target action transform: Gaussian noise with mean 0.0 and std 0.2#
[[td3.target_action_tf]]
type = "AdditiveNoiseTF"
[td3.target_action_tf.kwargs.noise]
type = "NormalNoise"
[td3.target_action_tf.kwargs.noise.kwargs]
mean = 0.0
std = 0.1
# No eval action transform or train action transform

[overrides.euler-matrix-dense] # https://wandb.ai/lsy-tum/rot%7Ctd3_sweep/runs/fxfsyzyg?nw=nwuseru1999168
